services:
    laravel.test:
        build:
            context: ./docker
            dockerfile: Dockerfile
        image: sci-safety-app
        ports:
            - '${APP_PORT:-8080}:8000'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
networks:
    sail:
        driver: bridge
