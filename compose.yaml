services:
    laravel.test:
        build:
            context: ./docker
            dockerfile: Dockerfile
        image: sci-safety-app
        ports:
            - '${APP_PORT:-8080}:8000'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            DB_CONNECTION: mysql
            DB_HOST: host.docker.internal
            DB_PORT: '${DB_PORT:-3306}'
            DB_DATABASE: '${DB_DATABASE:-safetydb}'
            DB_USERNAME: '${DB_USERNAME:-safetydb}'
            DB_PASSWORD: '${DB_PASSWORD:-safetydb}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
networks:
    sail:
        driver: bridge
